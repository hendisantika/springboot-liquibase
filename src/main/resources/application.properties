spring.application.name=springboot-liquibase

# Point at your own instance with MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/liquibase?createDatabaseIfNotExist=true&useUnicode=true&serverTimezone=Asia/Jakarta&useSSL=false}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
